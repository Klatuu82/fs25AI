[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fs25ai-companion"
version = "0.1.0"
description = "FastAPI companion service for FS25 AI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116,<1.0",
    "pydantic>=2.9,<3.0",
    "uvicorn>=0.35,<1.0"
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.3,<9.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "planner*", "providers*", "schemas*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
