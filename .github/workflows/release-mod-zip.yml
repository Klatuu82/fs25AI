name: Release FS25 Mod ZIP

on:
  push:
    tags:
      - 'v*.*.*.*'

permissions:
  contents: read

jobs:
  validate-release-tag:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - name: Check version tag format
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use v<major>.<minor>.<patch>.<build>." >&2
            exit 1
          fi

  build:
    name: Build install-ready FS25 mod ZIP
    needs: validate-release-tag
    uses: ./.github/workflows/build-mod-zip.yml
    with:
      ref: ${{ github.event.release.tag_name || github.ref }}
    permissions:
      contents: read

  publish:
    name: Publish GitHub Release asset
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download generated ZIP
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: dist

      - name: Verify generated ZIP matches release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
          ARTIFACT_NAME: ${{ needs.build.outputs.artifact-name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          version="${version//./_}"
          expected_name="FS25_fs25AI_${version}.zip"
          if [[ "${ARTIFACT_NAME}" != "${expected_name}" ]]; then
            echo "Generated artifact ${ARTIFACT_NAME} does not match ${RELEASE_TAG}." >&2
            exit 1
          fi
          test -f "dist/${ARTIFACT_NAME}"

      - name: Create release for version tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "${RELEASE_TAG}" --title "${RELEASE_TAG}" --generate-notes

      - name: Upload ZIP to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          ARTIFACT_NAME: ${{ needs.build.outputs.artifact-name }}
        run: gh release upload "${RELEASE_TAG}" "dist/${ARTIFACT_NAME}" --clobber
